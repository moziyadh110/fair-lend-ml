services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: credit_default
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline123
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Build context is the project root: the API imports explainability/ too,
  # and the image bakes in artifacts/champion_model.joblib (run
  # models/train_champion.py first). No MLflow server: the registry is a local
  # store used at training time, and serving falls back to the baked-in artifact.
  api:
    build:
      context: .
      dockerfile: serving/Dockerfile
    ports: ["8000:8000"]
    depends_on: [redis]
    env_file: .env   # API_KEY
    environment:
      REDIS_HOST: redis

  dashboard:
    build: ./dashboard
    ports: ["8501:8501"]
    depends_on: [postgres]

  airflow:
    build: ./airflow
    ports: ["8080:8080"]
    depends_on: [postgres]
    # Whole project mounted (not just dags/) — the DAG's task callables import
    # project modules directly (data_engineering, models, monitoring, serving),
    # and each file resolves its own project root via Path(__file__).resolve().
    volumes: ["./:/opt/airflow/project"]
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Overrides whatever POSTGRES_HOST is set to in the mounted .env — inside
      # this container Postgres is reachable at the Compose service name, not
      # localhost. python-dotenv's load_dotenv() doesn't override vars already
      # set in the environment, so this wins over .env's value.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    working_dir: /opt/airflow/project
    command: standalone

volumes:
  pgdata:
